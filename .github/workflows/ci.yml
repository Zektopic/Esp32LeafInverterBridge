name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: leaf_can (unit + differential vs v1.3.0)
        run: |
          cmake -S lib/leaf_can -B build/leaf_can -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
          cmake --build build/leaf_can -j
          ctest --test-dir build/leaf_can --output-on-failure
      - name: bridge_settings
        run: |
          cmake -S lib/bridge_settings -B build/bridge_settings -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build/bridge_settings -j
          ctest --test-dir build/bridge_settings --output-on-failure
      - name: firmware-idf helpers (JSON, captive-portal DNS)
        run: |
          cmake -S firmware-idf/test/host -B build/idf_host -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build/idf_host -j
          ctest --test-dir build/idf_host --output-on-failure

  esp-idf:
    name: ESP-IDF firmware + QEMU end-to-end
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v4
      - name: Build (hardware)
        working-directory: firmware-idf
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - name: Build (QEMU test variants)
        working-directory: firmware-idf
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-qemu -D SDKCONFIG=build-qemu/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu" build
          printf 'CONFIG_BRIDGE_SELFTEST_REQUIRE_CAN=y\n' > build-qemu-rb.overlay
          idf.py -B build-qemu-rb -D SDKCONFIG=build-qemu-rb/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu;build-qemu-rb.overlay" build
      - name: QEMU end-to-end (API, auth, NVS, captive portal, OTA, rollback, factory reset)
        working-directory: firmware-idf
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python test/qemu_e2e.py --build build-qemu --rollback-image build-qemu-rb/leaf_inverter_bridge.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-idf
          path: |
            firmware-idf/build/leaf_inverter_bridge.bin
            firmware-idf/build/bootloader/bootloader.bin
            firmware-idf/build/partition_table/partition-table.bin
            firmware-idf/build-qemu/qemu_e2e.log
      - name: Keep the QEMU build for the browser test
        uses: actions/upload-artifact@v4
        with:
          name: firmware-idf-qemu
          path: |
            firmware-idf/build-qemu/flash_args
            firmware-idf/build-qemu/leaf_inverter_bridge.bin
            firmware-idf/build-qemu/bootloader/bootloader.bin
            firmware-idf/build-qemu/partition_table/partition-table.bin
            firmware-idf/build-qemu/ota_data_initial.bin

  ui:
    name: Web UI in a browser (Playwright vs QEMU)
    needs: esp-idf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-idf-qemu
          path: firmware-idf/build-qemu
      - name: Boot a fresh device in QEMU
        run: |
          chmod -R a+rwX firmware-idf
          docker run -d --name leafqemu -p 127.0.0.1:18080:18080 -v "$PWD":/project -w /project/firmware-idf \
            espressif/idf:v6.1.1 bash -c '. $IDF_PATH/export.sh >/dev/null && \
            python test/qemu_e2e.py --build build-qemu --serve --listen 0.0.0.0'
          for i in $(seq 1 120); do docker logs leafqemu 2>&1 | grep -q SERVING && break; sleep 2; done
          docker logs leafqemu 2>&1 | tail -5
      - name: Browser test
        run: |
          docker run --rm --network host -v "$PWD":/work -w /work/firmware-idf/test/ui \
            mcr.microsoft.com/playwright:v1.65.1-noble bash -c 'npm ci --no-audit --no-fund && \
            node ui_test.mjs --url http://127.0.0.1:18080 --out /work/ui-shots \
            --firmware /work/firmware-idf/build-qemu/leaf_inverter_bridge.bin'
      - name: QEMU log
        if: always()
        run: docker logs leafqemu 2>&1 | tail -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots

  arduino:
    name: Arduino firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32dev-arduino2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Build (SERIAL_DEBUG)
        if: matrix.env == 'esp32dev'
        working-directory: firmware
        run: PLATFORMIO_BUILD_FLAGS="-DSERIAL_DEBUG" pio run -e esp32dev
