; Esp32LeafInverterBridge - Arduino firmware
;
;   pio run                      build (Arduino-ESP32 3.3.x)
;   pio run -t upload            flash firmware over USB
;   pio run -t uploadfs          flash the web UI (../web) to SPIFFS
;   pio device monitor           serial log (enable SERIAL_DEBUG in config.h)
;
; The shared libraries in ../lib (leaf_can, bridge_settings) are picked up
; through lib_extra_dirs.

[platformio]
src_dir = .
data_dir = ../web
default_envs = esp32dev

[env]
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.filesystem = spiffs
board_build.partitions = default.csv
lib_extra_dirs = ../lib
lib_deps =
    pierremolinaro/ACAN2515@2.1.5
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    ayushsharma82/ElegantOTA@3.1.7
build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -Wall
build_src_filter = +<*> -<.pio/> -<.git/>

; Default: Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5) via the pioarduino platform.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; Legacy: Arduino-ESP32 2.0.17 (ESP-IDF 4.4), the core v1.x was developed on.
[env:esp32dev-arduino2]
platform = espressif32@6.10.0
